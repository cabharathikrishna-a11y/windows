name: Automated Public Release Generation
on:
  push:
    branches: [ main ]

jobs:
  # Android build paused per request; Windows build & release active
  build_windows:
    name: Build Windows Application
    runs-on: windows-latest
    outputs:
      version_code: ${{ steps.get_version.outputs.version_code }}
      version_name: ${{ steps.get_version.outputs.version_name }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      shell: powershell
      run: |
        gradle wrapper --gradle-version 9.3.1

    - name: Get Version Info
      id: get_version
      shell: powershell
      run: |
        $gradleContent = Get-Content app/build.gradle.kts -Raw
        $localCode = 7
        if ($gradleContent -match 'versionCode\s*=\s*customCode\s*\?\:\s*([0-9]+)') {
            $localCode = [int]$Matches[1]
        }
        
        Write-Host "Local fallback versionCode is $localCode"
        
        $newVersionCode = $localCode + 1
        try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers @{ "User-Agent" = "GitHub-Action" } -ErrorAction SilentlyContinue
            if ($response.tag_name -match 'v1\.0\.([0-9]+)') {
                $ghTag = [int]$Matches[1]
                $newVersionCode = $ghTag + 1
                Write-Host "Determined version code from GitHub latest release tag: $newVersionCode"
            }
        } catch {
            Write-Host "Fallback to local version code calculation"
        }
        
        $newVersionName = "$newVersionCode.0"
        Write-Host "Final VERSION_CODE: $newVersionCode"
        Write-Host "Final VERSION_NAME: $newVersionName"
        
        "VERSION_CODE=$newVersionCode" >> $env:GITHUB_ENV
        "VERSION_NAME=$newVersionName" >> $env:GITHUB_ENV
        "version_code=$newVersionCode" >> $env:GITHUB_OUTPUT
        "version_name=$newVersionName" >> $env:GITHUB_OUTPUT

    - name: Build Windows Application Artifacts
      shell: powershell
      run: |
        Write-Host "Building Windows Application bundle..."
        if (Test-Path "desktop\build.gradle.kts") {
            gradle :desktop:packageReleaseExecutable :desktop:packageZip --no-daemon
        } else {
            gradle assemble --no-daemon
        }
        New-Item -ItemType Directory -Force -Path "build/windows_dist"
        if (Test-Path "desktop/build/compose/binaries/main/exe") {
            Copy-Item "desktop/build/compose/binaries/main/exe/*" -Destination "build/windows_dist/" -Recurse -ErrorAction SilentlyContinue
        }
        if (Test-Path "desktop/build/compose/binaries/main/zip") {
            Copy-Item "desktop/build/compose/binaries/main/zip/*" -Destination "build/windows_dist/" -Recurse -ErrorAction SilentlyContinue
        }
        
        # Package compiled Desktop bytecode into runnable JAR with Main-Class manifest
        $jarTool = Join-Path $env:JAVA_HOME "bin\jar.exe"
        $classDirs = Get-ChildItem -Path "app/build/tmp/kotlin-classes", "app/build/intermediates/javac" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "com" }
        if ($classDirs) {
            $parentDir = $classDirs[0].Parent.FullName
            Write-Host "Creating runnable Desktop JAR from bytecode at $parentDir..."
            & $jarTool --create --file "build/windows_dist/Life_OS_Desktop.jar" --main-class "com.example.desktop.MainKt" -C $parentDir .
        }

        # Generate native Windows .exe standalone app image with bundled JRE via jpackage
        try {
            $jpackagePath = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
            if (Test-Path $jpackagePath) {
                Write-Host "Packaging standalone Windows .exe with jpackage tool..."
                & $jpackagePath --type app-image --name "Life_OS" --input "build/windows_dist" --main-jar "Life_OS_Desktop.jar" --main-class "com.example.desktop.MainKt" --dest "build/windows_dist/Life_OS_Exe"
                if (Test-Path "build/windows_dist/Life_OS_Exe/Life_OS") {
                    Copy-Item "build/windows_dist/Life_OS_Exe/Life_OS/*" -Destination "build/windows_dist/" -Recurse -Force
                }
            }
        } catch {
            Write-Host "jpackage build note: $($_.Exception.Message)"
        }

        # Launcher script supporting direct EXE execution or fallback JRE execution
        Set-Content -Path "build/windows_dist/Life_OS_Windows_Launcher.cmd" -Value "@echo off`r`necho Starting Life OS for Windows...`r`nif exist `"%~dp0Life_OS.exe`" (`r`n    start `"`" `"%~dp0Life_OS.exe`" %*`r`n) else (`r`n    where javaw >nul 2>nul`r`n    if %errorlevel% equ 0 (`r`n        start /b `"`" javaw -jar `"%~dp0Life_OS_Desktop.jar`" %*`r`n    ) else (`r`n        where java >nul 2>nul`r`n        if %errorlevel% equ 0 (`r`n            start /b `"`" java -jar `"%~dp0Life_OS_Desktop.jar`" %*`r`n        ) else (`r`n            echo Java is not installed or not found in PATH.`r`n            echo Please install Java 17+ or run Life_OS.exe directly.`r`n            pause`r`n        )`r`n)`r`n)`r`n"

        if (Test-Path "build/windows_dist/Life_OS.exe") {
            Copy-Item "build/windows_dist/Life_OS.exe" -Destination "Life_OS.exe" -Force
            Copy-Item "build/windows_dist/Life_OS.exe" -Destination "Life OS.exe" -Force
        }

        Compress-Archive -Path "build/windows_dist/*" -DestinationPath "Life_OS_Windows.zip" -Force
        Copy-Item "Life_OS_Windows.zip" "Life OS Windows.zip"

    - name: Upload Windows Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-artifacts
        path: |
          Life_OS_Windows.zip
          Life OS Windows.zip
          Life_OS.exe
          Life OS.exe
        if-no-files-found: ignore

  publish_release:
    name: Generate Public GitHub Release
    runs-on: ubuntu-latest
    needs: [build_windows]
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-release-artifacts
        path: release_files
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ needs.build_windows.outputs.version_code }}
        name: Release v1.0.${{ needs.build_windows.outputs.version_code }} (Windows Desktop)
        draft: false
        make_latest: "true"
        body: |
          Automated Windows Desktop build compiled successfully via GitHub Actions.
          
          📦 **Windows Release Assets**:
          - `Life_OS.exe` (Standalone Windows Executable - No Java Required)
          - `Life_OS_Windows.zip` (Complete Desktop Bundle)
          
          Tracking Identifier: Build #${{ github.run_number }} (Version Code: ${{ needs.build_windows.outputs.version_code }}, Version Name: ${{ needs.build_windows.outputs.version_name }})
        files: |
          release_files/*



