name: Automated Public Release Generation
on:
  push:
    branches: [ main ]

jobs:
  # Android build paused per request; Windows build & release active
  build_windows:
    name: Build Windows Application
    runs-on: windows-latest
    outputs:
      version_code: ${{ steps.get_version.outputs.version_code }}
      version_name: ${{ steps.get_version.outputs.version_name }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      shell: powershell
      run: |
        gradle wrapper --gradle-version 9.3.1

    - name: Get Version Info
      id: get_version
      shell: powershell
      run: |
        $gradleContent = Get-Content app/build.gradle.kts -Raw
        $localCode = 7
        if ($gradleContent -match 'versionCode\s*=\s*customCode\s*\?\:\s*([0-9]+)') {
            $localCode = [int]$Matches[1]
        }
        
        Write-Host "Local fallback versionCode is $localCode"
        
        $newVersionCode = $localCode + 1
        try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers @{ "User-Agent" = "GitHub-Action" } -ErrorAction SilentlyContinue
            if ($response.tag_name -match 'v1\.0\.([0-9]+)') {
                $ghTag = [int]$Matches[1]
                $newVersionCode = $ghTag + 1
                Write-Host "Determined version code from GitHub latest release tag: $newVersionCode"
            }
        } catch {
            Write-Host "Fallback to local version code calculation"
        }
        
        $newVersionName = "$newVersionCode.0"
        Write-Host "Final VERSION_CODE: $newVersionCode"
        Write-Host "Final VERSION_NAME: $newVersionName"
        
        "VERSION_CODE=$newVersionCode" >> $env:GITHUB_ENV
        "VERSION_NAME=$newVersionName" >> $env:GITHUB_ENV
        "version_code=$newVersionCode" >> $env:GITHUB_OUTPUT
        "version_name=$newVersionName" >> $env:GITHUB_OUTPUT

    - name: Build Windows Application Artifacts
      shell: powershell
      run: |
        Write-Host "Building Windows Application bundle..."
        if (Test-Path "desktop\build.gradle.kts") {
            gradle :desktop:packageReleaseExecutable :desktop:packageZip --no-daemon
        } else {
            gradle assemble --no-daemon
        }
        New-Item -ItemType Directory -Force -Path "build/windows_dist"
        if (Test-Path "desktop/build/compose/binaries/main/exe") {
            Copy-Item "desktop/build/compose/binaries/main/exe/*" -Destination "build/windows_dist/" -Recurse -ErrorAction SilentlyContinue
        }
        if (Test-Path "desktop/build/compose/binaries/main/zip") {
            Copy-Item "desktop/build/compose/binaries/main/zip/*" -Destination "build/windows_dist/" -Recurse -ErrorAction SilentlyContinue
        }
        
        # Create isolated staging directories for packaging to prevent recursive path length issues
        New-Item -ItemType Directory -Force -Path "build/jpackage_input"
        New-Item -ItemType Directory -Force -Path "build/jpackage_output"
        New-Item -ItemType Directory -Force -Path "build/windows_dist"

        # Package compiled Desktop bytecode into runnable JAR with Main-Class manifest
        $jarTool = Join-Path $env:JAVA_HOME "bin\jar.exe"
        $classDirs = Get-ChildItem -Path "app/build/tmp/kotlin-classes", "app/build/intermediates/javac" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "com" }
        if ($classDirs) {
            $parentDir = $classDirs[0].Parent.FullName
            Write-Host "Creating runnable Desktop JAR from bytecode at $parentDir..."
            & $jarTool --create --file "build/jpackage_input/Life_OS_Desktop.jar" --main-class "com.example.desktop.MainKt" -C $parentDir .
            Copy-Item "build/jpackage_input/Life_OS_Desktop.jar" -Destination "build/windows_dist/Life_OS_Desktop.jar" -Force
        }

        # Generate native Windows .exe standalone app image with bundled JRE via jpackage
        try {
            $jpackagePath = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
            if ((Test-Path $jpackagePath) -and (Test-Path "build/jpackage_input/Life_OS_Desktop.jar")) {
                Write-Host "Packaging standalone Windows .exe with jpackage tool..."
                & $jpackagePath --type app-image --name "Life_OS" --input "build/jpackage_input" --main-jar "Life_OS_Desktop.jar" --main-class "com.example.desktop.MainKt" --dest "build/jpackage_output"
                if (Test-Path "build/jpackage_output/Life_OS") {
                    Copy-Item "build/jpackage_output/Life_OS/*" -Destination "build/windows_dist/" -Recurse -Force
                }
            }
        } catch {
            Write-Host "jpackage build note: $($_.Exception.Message)"
        }

        # Write App URL config file
        Set-Content -Path "build/windows_dist/app_url.txt" -Value "https://ais-pre-wzrnxak24bqyxyrm3fnzxv-269590861741.asia-southeast1.run.app"

        # Copy compiled Android APK into distribution
        $apkFile = Get-ChildItem -Path "app/build/outputs/apk" -Filter "*.apk" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($apkFile) {
            Copy-Item $apkFile.FullName -Destination "build/windows_dist/Life_OS_Android.apk" -Force
            Copy-Item $apkFile.FullName -Destination "Life_OS_Android.apk" -Force
        }

        # Build Standalone C# App Launcher EXE (Life_OS.exe)
        try {
            $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
            if (-not (Test-Path $cscPath)) {
                $foundCsc = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio", "C:\Program Files (x86)\Microsoft Visual Studio", "C:\Windows\Microsoft.NET" -Filter "csc.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "v2.0" } | Select-Object -First 1
                if ($foundCsc) { $cscPath = $foundCsc.FullName }
            }
            if (Test-Path $cscPath) {
                $appLauncherSource = "$PWD\tools\AppLauncher.cs"
                $appLauncherOut = "$PWD\Life_OS.exe"
                if (Test-Path $appLauncherSource) {
                    (Get-Content "$appLauncherSource") -replace "GH_REPO_PLACEHOLDER", "${{ github.repository }}" | Set-Content "$appLauncherSource"
                    Write-Host "Compiling Standalone Desktop App EXE ($appLauncherSource) with $cscPath..."
                    & $cscPath /target:winexe /out:"$appLauncherOut" /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll "$appLauncherSource"
                }
            }
        } catch {
            Write-Host "C# Launcher Compilation Note: $($_.Exception.Message)"
        }

        # Copy compiled Android APK
        $apkFile = Get-ChildItem -Path "app/build/outputs/apk" -Filter "*.apk" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($apkFile) {
            Copy-Item $apkFile.FullName -Destination "Life_OS.apk" -Force
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          Life_OS.exe
          Life_OS.apk
        if-no-files-found: ignore

  publish_release:
    name: Generate Public GitHub Release
    runs-on: ubuntu-latest
    needs: [build_windows]
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Download Release Artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts
        path: release_files
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ needs.build_windows.outputs.version_code }}
        name: Release v1.0.${{ needs.build_windows.outputs.version_code }} (Life OS App)
        draft: false
        make_latest: "true"
        body: |
          Life OS Standalone Application Release.
          
          📦 **Release Assets**:
          - 💻 `Life_OS.exe` — Standalone Windows Desktop Application (Double-click to open)
          - 📱 `Life_OS.apk` — Android Mobile Application
          
          Build Identifier: Version Code ${{ needs.build_windows.outputs.version_code }}
        files: |
          release_files/Life_OS.exe
          release_files/Life_OS.apk



